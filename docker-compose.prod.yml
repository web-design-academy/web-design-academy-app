services:
  backend:
    container_name: webdesignacademy-backend
    restart: unless-stopped
    image: dexter.fit.vutbr.cz/webdesignacademy/webdesignacademy-backend
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - type: bind
        source: ${LESSONS_HOST_PATH:-./lessons}
        target: /app/lessons
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # any HTTP response below 500 = the app is up (unknown path → 404, outside /api rate limiting)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz-probe').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - webdesignacademyNetwork

  frontend:
    container_name: webdesignacademy-frontend
    restart: unless-stopped
    image: dexter.fit.vutbr.cz/webdesignacademy/webdesignacademy-frontend
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first, nginx listens on IPv4 only
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/wda/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webdesignacademyNetwork

  proxy:
    container_name: webdesignacademy-proxy
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webdesignacademyNetwork
      - network

networks:
  network:
    name: kristyna-dev
    external: true
  webdesignacademyNetwork:
    name: webdesignacademyNetwork
