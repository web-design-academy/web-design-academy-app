<main>
	<h1>Animal Gallery</h1>

	<div class="carousel" role="region" aria-roledescription="carousel" aria-label="Animal gallery">
		<input type="radio" name="slides" id="slide1" checked>
		<input type="radio" name="slides" id="slide2">

		<div class="slides">
			<img src="https://api.slingacademy.com/public/sample-photos/1.jpeg" alt="Owl" aria-hidden="false">
			<img src="https://api.slingacademy.com/public/sample-photos/2.jpeg" alt="Falcon" aria-hidden="true">
		</div>

		<nav>
			<label for="slide1" class="prev" aria-label="Go to first slide">❮</label>
			<label for="slide2" class="next" aria-label="Go to second slide">❯</label>
		</nav>
	</div>
</main>
