services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - frontend/.env
    environment:
      - VITE_PROXY_TARGET=http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./BP-Viragova:/BP-Viragova
      - /app/node_modules

volumes:
  backend_storage:
