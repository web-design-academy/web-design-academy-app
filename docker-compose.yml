services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    env_file:
      - apps/backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - backend_storage:/app/storage
      - type: bind
        source: ${LESSONS_HOST_PATH:-./lessons}
        target: /app/lessons
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    env_file:
      - apps/frontend/.env
    environment:
      - VITE_PROXY_TARGET=http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
      - ./packages/visual-editor/src:/app/packages/visual-editor/src
      - ./packages/visual-preview/src:/app/packages/visual-preview/src
      - ./packages/ui-styles:/app/packages/ui-styles

volumes:
  backend_storage:
